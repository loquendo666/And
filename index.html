function playStream(url, nombre) {
  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }

  if (Hls.isSupported()) {
    hlsInstance = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 90
    });
    
    hlsInstance.loadSource(url);
    hlsInstance.attachMedia(player);
    
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
      player.play().catch(() => {});
      status.textContent = `● ${nombre}`;
      status.style.color = '#ff69b4';
    });
    
    hlsInstance.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        status.textContent = '● Error';
        status.style.color = '#ff3366';
      }
    });
  } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
    player.src = url;
    player.play().catch(() => {});
    status.textContent = `● ${nombre}`;
  }
}

function esFavorito(nombre) {
  const favs = JSON.parse(localStorage.getItem("favoritos") || "[]");
  return favs.includes(nombre);
}

function toggleFav(e, nombre) {
  e.stopPropagation();
  let favs = JSON.parse(localStorage.getItem("favoritos") || "[]");
  if (favs.includes(nombre)) {
    favs = favs.filter(n => n !== nombre);
  } else {
    favs.push(nombre);
  }
  localStorage.setItem("favoritos", JSON.stringify(favs));
  renderCanales();
}

}
